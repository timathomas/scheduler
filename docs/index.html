<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a time with Tim Thomas</title>
  <meta name="description" content="Pick a time to meet with Tim Thomas.">
  <style>
    :root { --bg: #f6f4ef; --ink: #1d2126; --muted: #5d636b; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #14171a; --ink: #ebe8e2; --muted: #a3a8ae; }
    }
    :root[data-theme="dark"] { --bg: #14171a; --ink: #ebe8e2; --muted: #a3a8ae; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .wait { max-width: 520px; margin: 0 auto; padding: 64px 16px; }
    .wait p { color: var(--muted); }
  </style>
</head>
<body>
  <script>
    // The Apps Script web app this page shows. Set after the first deployment
    // (Deploy > Manage deployments > Web app URL); it stays the same across
    // later versions.
    var APP_URL = '';

    if (APP_URL) {
      var frame = document.createElement('iframe');
      frame.title = 'Book a time with Tim Thomas';
      frame.allow = 'clipboard-write';
      frame.src = APP_URL + window.location.search;
      document.body.appendChild(frame);
    } else {
      document.body.innerHTML = '<div class="wait"><h1>Book a time with Tim Thomas</h1>' +
        '<p>This page is being set up. Please check back soon, or email Tim directly.</p></div>';
    }
  </script>
</body>
</html>
